name: "corpus"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CORPUS_PATH: ~/.cache/shell-lsp/corpus

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: key
        run: echo "key=corpus-${{ hashFiles('corpus/repos.txt') }}" >>"$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache
        with:
          path: ${{ env.CORPUS_PATH }}
          key: ${{ steps.key.outputs.key }}
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version-file: go.mod
      - if: steps.cache.outputs.cache-hit != 'true'
        run: go run ./cmd/lintcheck fetch

  shellcheck:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS_PATH }}
          key: ${{ needs.fetch.outputs.key }}
          fail-on-cache-miss: true
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop --command go run ./cmd/lintcheck shellcheck

  shells:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS_PATH }}
          key: ${{ needs.fetch.outputs.key }}
          fail-on-cache-miss: true
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - run: nix develop --command go run ./cmd/lintcheck shells
