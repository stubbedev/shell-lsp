name: "release"

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: go test ./...
      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: just dist "$VERSION"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the binaries against what the VS Code extension downloads
        env:
          VERSION: ${{ github.ref_name }}
        run: node editors/vscode/scripts/checkReleaseAssets.ts dist "${VERSION#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="docs/releases/${VERSION}.md"
          if [[ ! -f "$notes" ]]; then
            echo "missing release notes: $notes" >&2
            exit 1
          fi
          gh release create "$VERSION" dist/* --repo "$GITHUB_REPOSITORY" --title "$VERSION" --notes-file "$notes" --verify-tag

  vscode:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: editors/vscode
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm version --no-git-tag-version "${VERSION#v}"
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$VERSION" "shell-lsp-${VERSION#v}.vsix" --repo "$GITHUB_REPOSITORY"
      - name: Decide where to publish
        id: registries
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" == *-* ]]; then
            echo "::notice::$VERSION is a pre-release; not publishing it to the extension registries"
            exit 0
          fi
          if [ -n "$VSCE_PAT" ]; then
            echo "marketplace=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::VSCE_PAT is not set; not publishing to the Visual Studio Marketplace"
          fi
          if [ -n "$OVSX_PAT" ]; then
            echo "openvsx=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::OVSX_PAT is not set; not publishing to Open VSX"
          fi
      - name: Publish to the Visual Studio Marketplace
        if: steps.registries.outputs.marketplace == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath "shell-lsp-${VERSION#v}.vsix"
      - name: Publish to Open VSX
        if: steps.registries.outputs.openvsx == 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish --packagePath "shell-lsp-${VERSION#v}.vsix"
