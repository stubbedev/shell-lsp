name: "fuzz"

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "How long to fuzz each target, as a Go duration"
        required: true
        default: "20m"

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  targets:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - id: list
        run: |
          matrix="$(just fuzz-targets | jq --raw-input --slurp --compact-output \
            '[split("\n")[] | select(. != "") | split(" ") | {package: .[0], target: .[1]}]')"
          if [[ "$matrix" == "[]" ]]; then
            echo "no fuzz targets found" >&2
            exit 1
          fi
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    name: ${{ matrix.target }} in ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      CGO_ENABLED: "0"
      PACKAGE: ${{ matrix.package }}
      TARGET: ${{ matrix.target }}
      FUZZTIME: ${{ inputs.fuzztime || '20m' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - run: just fuzz "$PACKAGE" "$TARGET" "$FUZZTIME"
      - name: Collect the failing inputs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/failing"
          git ls-files --others --exclude-standard -z -- ':(glob)**/testdata/fuzz/**' |
            xargs --null --no-run-if-empty cp --parents --target-directory "$RUNNER_TEMP/failing"
          {
            echo "### $TARGET in $PACKAGE failed"
            echo
            echo "Add each new input to the repository as a seed and fix the crash it reproduces:"
            echo
            (cd "$RUNNER_TEMP/failing" && find . -type f -printf '- %P\n')
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ strategy.job-index }}-${{ matrix.target }}
          path: ${{ runner.temp }}/failing
          if-no-files-found: warn
