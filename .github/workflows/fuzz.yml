name: "fuzz"

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "How long to fuzz each target, as a Go duration; empty for the nightly time"
        required: false

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  targets:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - id: list
        run: |
          matrix="$(just fuzz-targets | jq --raw-input --slurp --compact-output \
            '[split("\n")[] | select(. != "") | split(" ") | {package: .[0], target: .[1]}]')"
          if [[ "$matrix" == "[]" ]]; then
            echo "no fuzz targets found" >&2
            exit 1
          fi
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"

  fuzz:
    needs: targets
    name: ${{ matrix.target }} in ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    env:
      CGO_ENABLED: "0"
      PACKAGE: ${{ matrix.package }}
      TARGET: ${{ matrix.target }}
      FUZZTIME: ${{ inputs.fuzztime || '5m' }}
      GOMEMLIMIT: 3GiB
      REQUIRE_REFERENCES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: stubbedev/xilo@v2
        with:
          url: https://xilos.dev
          cache: stubbedev/main
      - id: corpus
        run: echo "dir=$(go env GOCACHE)/fuzz/$PACKAGE/$TARGET" >>"$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-${{ matrix.target }}-${{ matrix.package }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-${{ matrix.target }}-${{ matrix.package }}-
      - id: fuzz
        run: nix develop .#fuzz --command just fuzz "$PACKAGE" "$TARGET" "$FUZZTIME"
      - id: save
        if: always() && steps.restore.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: ${{ steps.restore.outputs.cache-primary-key }}
      - name: Drop the corpus this run grew from
        if: always() && steps.fuzz.outcome == 'success' && steps.save.outcome == 'success' && steps.restore.outputs.cache-matched-key != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.restore.outputs.cache-matched-key }}
        run: gh cache delete "$OLD" --repo "$GITHUB_REPOSITORY"
      - name: Collect the failing inputs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/failing"
          git ls-files --others --exclude-standard -z -- ':(glob)**/testdata/fuzz/**' |
            xargs --null --no-run-if-empty cp --parents --target-directory "$RUNNER_TEMP/failing"
          {
            echo "### $TARGET in $PACKAGE failed"
            echo
            echo "Add each new input to the repository as a seed and fix the crash it reproduces:"
            echo
            (cd "$RUNNER_TEMP/failing" && find . -type f -printf '- %P\n')
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-${{ strategy.job-index }}-${{ matrix.target }}
          path: ${{ runner.temp }}/failing
          if-no-files-found: warn
