name: "perf"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CORPUS_PATH: ~/.cache/shell-lsp/corpus-nix

defaults:
  run:
    shell: bash

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS_PATH }}
          key: corpus-nix-${{ hashFiles('corpus/nix/repos.txt') }}
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - uses: stubbedev/xilo@v2
        with:
          url: https://xilos.dev
          cache: stubbedev/main
      - name: Measure
        run: nix develop --command go run ./cmd/perfreport run -runner "GitHub Actions ${ImageOS:?} ${ImageVersion:?}" -out "$RUNNER_TEMP/perf/perf.json"
      - name: Summarise
        run: nix develop --command go run ./cmd/perfreport notes "$RUNNER_TEMP/perf/perf.json" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-report
          path: ${{ runner.temp }}/perf/perf.json
          if-no-files-found: error
